# =============================================================
#  SKM College Management System — Application Properties
#  Environment: Development
# =============================================================

spring.application.name=skm-backend
server.port=${PORT:8080}
server.servlet.context-path=/

# --- Datasource ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/college_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Connection Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=SKMHikariPool

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.open-in-view=false

# --- JWT ---
app.jwt.secret=${APP_JWT_SECRET:SKM_SUPER_SECRET_KEY_FOR_JWT_SIGNING_MUST_BE_256_BITS_MINIMUM_LENGTH_32}
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000
app.jwt.issuer=skm-college

# --- Email (configure with real SMTP before production) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@skmahavidyalaya.ac.in
spring.mail.password=your_app_password_here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=noreply@skmahavidyalaya.ac.in
app.mail.from-name=SKM College
app.email-verification.enabled=false

# --- File Upload ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=./uploads
app.upload.allowed-types=image/jpeg,image/png,image/gif,application/pdf

# --- Cache ---
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=600s

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# --- Logging ---
logging.level.root=INFO
logging.level.com.skm=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/skm-backend.log

# --- CORS ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app,https://*.vercel.dev}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.max-age=3600

# --- OTP ---
app.otp.expiry-minutes=10
app.otp.length=6

# --- Pagination defaults ---
app.pagination.default-page=0
app.pagination.default-size=10
app.pagination.max-size=100

# --- SpringDoc / Swagger ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true

# --- Rate limiting (requests per minute per IP) ---
app.rate-limit.capacity=60
app.rate-limit.refill-per-minute=60

# --- Admin default credentials (change immediately after first run) ---
app.admin.default-email=admin@skmahavidyalaya.ac.in
app.admin.default-password=Admin@SKM2024
app.admin.default-name=System Administrator
